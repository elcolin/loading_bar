<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Minuteur avec barre de chargement</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: #eee;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    button {
      cursor: pointer;
      background: #4caf50;
      color: white;
    }

    button.secondary {
      background: #2196f3;
    }

    .bar-container {
      width: 300px;
      height: 20px;
      background: #333;
      border-radius: 10px;
      overflow: hidden;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4caf50, #8bc34a);
      transition: width 0.1s linear;
    }

    .bar.checkpoint {
      background: linear-gradient(90deg, #ff9800, #ffc107);
    }

    .time {
      font-size: 14px;
      opacity: 0.8;
    }

    .time.secondary {
      font-size: 12px;
      opacity: 0.5;
    }

    .checkpoint-config {
      display: flex;
      flex-direction: column;
      gap: 10px;
      align-items: center;
    }

    .checkpoint-label {
      font-size: 12px;
      opacity: 0.7;
    }
  </style>
</head>
<body>

<input id="timeInput" placeholder="Ex: 1h28m0s">

<div class="checkpoint-config">
  <div class="checkpoint-label">Configuration des pauses (checkpoint)</div>
  <input id="checkpointDuration" placeholder="Durée pause: 5m">
  <input id="checkpointInterval" placeholder="Intervalle: 25m">
</div>

<button id="notificationBtn" class="secondary">Activer les notifications</button>
<div class="checkpoint-label" id="notificationStatus" style="color: #ff9800; display: none;">⚠️ Activez les notifications pour recevoir des alertes</div>

<button id="startBtn">Démarrer</button>

<div style="display: flex; gap: 10px; justify-content: center;">
  <button id="pauseBtn" style="display: none; background: #ff9800;">Pause</button>
  <button id="skipBtn" style="display: none; background: #f44336;">Passer</button>
</div>

  <div class="bar-container">
    <div class="bar" id="bar"></div>
  </div>

  <div class="time" id="timeDisplay"></div>
  <div class="time secondary" id="totalTimeDisplay" aria-label="Temps total restant"></div>

  <script>
let interval = null;
let started = false;
let isPaused = false;
let notificationPermissionGranted = false;

// Checkpoint state
let checkpointEnabled = false;
let workTimeElapsed = 0;
let checkpointDurationSeconds = 0;
let checkpointIntervalSeconds = 0;
let isInCheckpoint = false;
let checkpointRemaining = 0;

// Store timer state for pause/resume
let totalSeconds = 0;
let remaining = 0;

document.getElementById("startBtn").addEventListener("click", startTimer);
document.getElementById("pauseBtn").addEventListener("click", togglePause);
document.getElementById("skipBtn").addEventListener("click", skipPhase);
document.getElementById("notificationBtn").addEventListener("click", requestNotificationPermission);

document.getElementById("timeInput").addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    startTimer();
  }
});

function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = seconds % 60;
  return `${min}:${sec.toString().padStart(2, "0")}`;
}

async function requestNotificationPermission() {
  if (!("Notification" in window)) {
    alert("Ce navigateur ne supporte pas les notifications.");
    return;
  }

  try {
    const permission = await Notification.requestPermission();
    if (permission === "granted") {
      notificationPermissionGranted = true;
      document.getElementById("notificationStatus").style.display = "none";
      document.getElementById("notificationBtn").textContent = "✓ Notifications activées";
      document.getElementById("notificationBtn").style.background = "#4caf50";
      new Notification("Notifications actives", {
        body: "Vous recevrez une notification lors des pauses checkpoint.",
        icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>⏱️</text></svg>"
      });
    } else {
      alert("Permission de notification refusée. Les notifications ne fonctionneront pas.");
    }
  } catch (error) {
    console.error("Erreur lors de la demande de permission:", error);
    alert("Une erreur est survenue lors de la demande de permission.");
  }
}

function sendNotification(title, body) {
  console.log("sendNotification appelé:", title, body);
  console.log("Permission accordée:", notificationPermissionGranted);
  console.log("Notification API disponible:", "Notification" in window);
  
  if (notificationPermissionGranted && "Notification" in window) {
    const options = {
      body: body,
      icon: "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='75' font-size='75'>☕</text></svg>",
      requireInteraction: true,
      tag: "checkpoint-notification",
      silent: false
    };
    
    // Add vibrate only if supported (mobile devices)
    if ('vibrate' in navigator) {
      options.vibrate = [200, 100, 200];
    }
    
    try {
      const notification = new Notification(title, options);
      console.log("Notification créée avec succès");
    } catch (error) {
      console.error("Erreur lors de la création de la notification:", error);
    }
  } else {
    console.warn("Notifications non disponibles ou permission non accordée");
  }
}

function parseTime(value) {
  const regex = /(\d+)\s*(h|m|s)/gi;
  let totalSeconds = 0;
  let match;

  while ((match = regex.exec(value)) !== null) {
    const amount = parseInt(match[1], 10);
    const unit = match[2].toLowerCase();

    if (unit === "h") totalSeconds += amount * 3600;
    if (unit === "m") totalSeconds += amount * 60;
    if (unit === "s") totalSeconds += amount;
  }

  return totalSeconds > 0 ? totalSeconds : null;
}

function togglePause() {
  const pauseBtn = document.getElementById("pauseBtn");
  
  if (isPaused) {
    // Resume
    isPaused = false;
    pauseBtn.textContent = "Pause";
    pauseBtn.style.background = "#ff9800";
    console.log("Timer resumed");
  } else {
    // Pause
    isPaused = true;
    pauseBtn.textContent = "Reprendre";
    pauseBtn.style.background = "#4caf50";
    console.log("Timer paused");
  }
}

function skipPhase() {
  console.log("Skip phase called. isInCheckpoint:", isInCheckpoint);
  
  if (isInCheckpoint) {
    // Skip checkpoint - go back to work
    isInCheckpoint = false;
    workTimeElapsed = 0;
    checkpointRemaining = 0;
    const bar = document.getElementById("bar");
    bar.classList.remove("checkpoint");
    console.log("Checkpoint skipped, resuming work");
  } else {
    // Skip work phase - trigger checkpoint if enabled, or do nothing
    if (checkpointEnabled) {
      isInCheckpoint = true;
      checkpointRemaining = checkpointDurationSeconds;
      const bar = document.getElementById("bar");
      bar.classList.add("checkpoint");
      bar.style.width = "0%";
      const durationMin = Math.floor(checkpointDurationSeconds / 60);
      const durationSec = checkpointDurationSeconds % 60;
      const durationText = durationMin > 0 
        ? `${durationMin} minute(s)${durationSec > 0 ? ` et ${durationSec} seconde(s)` : ''}`
        : `${durationSec} seconde(s)`;
      console.log("Work phase skipped, starting checkpoint");
      sendNotification("Pause checkpoint !", `Prenez une pause de ${durationText}.`);
    } else {
      console.log("No checkpoint configured, cannot skip work phase");
    }
  }
}


    function startTimer() {
      clearInterval(interval);
      isPaused = false;

      const input = document.getElementById("timeInput").value.trim();
      totalSeconds = parseTime(input);
      if (!totalSeconds) {
        alert("Format invalide. Utilise par exemple 5m, 1h ou 30s.");
        return;
      }

      // Show pause and skip buttons
      document.getElementById("pauseBtn").style.display = "inline-block";
      document.getElementById("pauseBtn").textContent = "Pause";
      document.getElementById("pauseBtn").style.background = "#ff9800";
      document.getElementById("skipBtn").style.display = "inline-block";

      // Parse checkpoint configuration
      const checkpointDurationInput = document.getElementById("checkpointDuration").value.trim();
      const checkpointIntervalInput = document.getElementById("checkpointInterval").value.trim();

      if (checkpointDurationInput && checkpointIntervalInput) {
        checkpointDurationSeconds = parseTime(checkpointDurationInput);
        checkpointIntervalSeconds = parseTime(checkpointIntervalInput);

        if (checkpointDurationSeconds && checkpointIntervalSeconds) {
          checkpointEnabled = true;
          
          // Warn if notifications are not enabled
          if (!notificationPermissionGranted) {
            document.getElementById("notificationStatus").style.display = "block";
            alert("⚠️ Astuce : Cliquez sur 'Activer les notifications' pour recevoir des alertes lors des pauses checkpoint !");
          }
        } else {
          alert("Format de checkpoint invalide. Désactivation des checkpoints.");
          checkpointEnabled = false;
        }
      } else {
        checkpointEnabled = false;
      }

      const bar = document.getElementById("bar");
      const display = document.getElementById("timeDisplay");
      const totalDisplay = document.getElementById("totalTimeDisplay");

      let remaining = totalSeconds;
      workTimeElapsed = 0;
      isInCheckpoint = false;
      bar.style.width = "0%";
      bar.classList.remove("checkpoint");

      interval = setInterval(() => {
        // Skip timer updates if paused
        if (isPaused) {
          return;
        }
        
        if (isInCheckpoint) {
          // Checkpoint timer
          checkpointRemaining--;
          const progress = ((checkpointDurationSeconds - checkpointRemaining) / checkpointDurationSeconds) * 100;
          bar.style.width = progress + "%";

          display.textContent = `Pause checkpoint : ${formatTime(checkpointRemaining)}`;

          // Show total remaining time
          totalDisplay.textContent = `Temps total restant : ${formatTime(remaining)}`;

          if (checkpointRemaining <= 0) {
            // End checkpoint, resume work
            isInCheckpoint = false;
            workTimeElapsed = 0;
            bar.classList.remove("checkpoint");
            sendNotification("Pause terminée !", "Reprise du travail. Bon courage !");
            console.log("Checkpoint terminé, reprise du travail");
          }
        } else {
          // Work timer
          remaining--;
          workTimeElapsed++;

          const progress = ((totalSeconds - remaining) / totalSeconds) * 100;
          bar.style.width = progress + "%";

          // Display time until next checkpoint (or total time if no checkpoint)
          if (checkpointEnabled) {
            // Time until next checkpoint
            const timeUntilCheckpoint = Math.max(0, checkpointIntervalSeconds - workTimeElapsed);
            display.textContent = `Prochain checkpoint dans : ${formatTime(timeUntilCheckpoint)}`;
          } else {
            // No checkpoint, show total remaining time
            display.textContent = `Temps restant : ${formatTime(remaining)}`;
          }

          // Always show total remaining time in secondary display
          totalDisplay.textContent = `Temps total restant : ${formatTime(remaining)}`;

          // Check if checkpoint should trigger
          if (checkpointEnabled && workTimeElapsed >= checkpointIntervalSeconds) {
            isInCheckpoint = true;
            checkpointRemaining = checkpointDurationSeconds;
            bar.classList.add("checkpoint");
            const durationMin = Math.floor(checkpointDurationSeconds / 60);
            const durationSec = checkpointDurationSeconds % 60;
            const durationText = durationMin > 0 
              ? `${durationMin} minute(s)${durationSec > 0 ? ` et ${durationSec} seconde(s)` : ''}`
              : `${durationSec} seconde(s)`;
            console.log("Checkpoint déclenché ! Notification envoyée.");
            sendNotification("Pause checkpoint !", `Prenez une pause de ${durationText}.`);
          }

          if (remaining <= 0) {
            clearInterval(interval);
            display.textContent = "Terminé.";
            totalDisplay.textContent = "";
            bar.style.width = "100%";
            bar.classList.remove("checkpoint");
          }
        }
      }, 1000);
    }
  </script>

</body>
</html>
